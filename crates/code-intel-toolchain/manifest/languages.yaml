# Languages and their language servers (docs/code-intel.md §3). Hand-written,
# pinned versions. Grammar entries are not here: CI generates them into
# grammars.json next to this file.
#
# servers[]:
#   detect     alternatives, each an argv; first one that runs wins. A
#              one-element argv only checks that the program exists.
#   download   per platform; sha256 is required (an entry without it is
#              dropped). redirect_hosts: the only hosts the URL may redirect to.
#   launch     argv. "{bin}" (the resolved binary) and "{runtime}" (what passed
#              `requires`) are whole arguments; "{dir}" (where the download was
#              unpacked; never with `detect`) and "{data}" (writable, per worktree
#              and trust mode, under the toolchain's root, never in the worktree;
#              Remove deletes it) may sit inside one.
#   requires   { runtime: node | java | ruby | php | dotnet | dotnet-sdk, min: 21
#              or "8.2" }. Checked by running the runtime (§4.3): missing or too
#              old, the server is skipped, found or downloaded alike, and nothing
#              is downloaded for it. dotnet-sdk: that runtime and any SDK.
#   hint       how to get it when Theodore can't; shown when nothing can serve.
#   start_timeout_secs  replaces the initialize timeout (60 s) and the warm-up cap
#              (180 s): a JVM importing a build takes minutes.
#   ready_settle_secs   quiet time before it counts as warmed up (default 1.5 s),
#              for a server slow to announce its work.
#   review_init_options  merged over init_options in a review run (§8). They
#              narrow what a server runs; they do not make it safe: rust-analyzer
#              still runs `cargo metadata` (a PR's .cargo/config.toml
#              `rustc-wrapper`, rust-toolchain.toml), typescript-language-server
#              loads node_modules/typescript. Hence review runs start servers
#              only when `code_intel.lsp.review` is on (off by default).
#   trusted_only  runs the project's code with no option to turn that off: never
#              started in a review run, even with `code_intel.lsp.review` on.
# languages[]: globs match the file name (`*.rs`, `Dockerfile`); a glob with a
#   `/` matches the repo-relative path. First language whose glob matches wins.
#   tags_extends  a language whose tags query is prepended to this one's
#              (upstream TypeScript tags.scm is written to extend JavaScript's).
#   prose      data or prose, not code (Markdown, JSON, YAML, TOML): never
#              searched by a code query's text fallback.

servers:
  - name: rust-analyzer
    version: "2026-10-26"
    detect: [["rust-analyzer", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-26/rust-analyzer-aarch64-apple-darwin.gz
        sha256: 8fb90cb58f5910d8d8b24ac1a93cca49f053365cbf0eb3c682144ad0a0027dcf
        size: 14092361
        format: gz
        bin: rust-analyzer
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
      darwin-x64:
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-26/rust-analyzer-x86_64-apple-darwin.gz
        sha256: b3e4904877bcf7013a4a342c449cff1bf0ea0b91d5a1a30ac8df3d32142519c0
        size: 14821659
        format: gz
        bin: rust-analyzer
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}"]
    workspace_folders: true
    # Build scripts, proc macros and `cargo check` run the project's code.
    review_init_options:
      cargo: { buildScripts: { enable: false } }
      procMacro: { enable: false }
      checkOnSave: false

  - name: ty
    version: "0.0.95"
    detect: [["ty", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/astral-sh/ty/releases/download/0.0.95/ty-aarch64-apple-darwin.tar.gz
        sha256: 379d341e8fb12d949e92fa7142f864cde835be5b2c1378d24c264a928c551857
        size: 13068441
        format: tar.gz
        bin: ty-aarch64-apple-darwin/ty
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}", "server"]
    workspace_folders: true

  - name: pyright
    # `pyright-langserver --version` waits on stdio: only check it exists.
    detect: [["pyright-langserver"]]
    launch: ["{bin}", "--stdio"]
    workspace_folders: true
    requires: { runtime: node, min: 14 }
    hint: npm install -g pyright

  - name: typescript-language-server
    detect: [["typescript-language-server", "--version"]]
    launch: ["{bin}", "--stdio"]
    workspace_folders: true
    # The floor is the oldest a release of it supports: installed, its own
    # version decides.
    requires: { runtime: node, min: 18 }
    hint: npm install -g typescript-language-server typescript
    review_init_options:
      plugins: []
      disableAutomaticTypingAcquisition: true

  - name: tsgo
    # TypeScript's native-preview compiler/language service (tsgo). Its
    # LSP mode is verified for definition/references/documentSymbol
    # (crates/code-intel-toolchain/tests/tsgo_lsp.rs, run with --ignored)
    # against this crate's own package: it answers all three. Listed ahead
    # of typescript-language-server (docs/code-intel.md §11 open question
    # resolved: default for TypeScript). It serves plain .js with no tsconfig
    # or jsconfig too (tests/server_lsp.rs), hence first for JavaScript.
    version: "7.0.0-dev.20260707.2"
    detect: [["tsgo", "--version"]]
    download:
      darwin-arm64:
        # The npm package is platform-specific
        # (@typescript/native-preview-darwin-arm64); the generic
        # @typescript/native-preview just execs this one's binary.
        url: https://registry.npmjs.org/@typescript/native-preview-darwin-arm64/-/native-preview-darwin-arm64-7.0.0-dev.20260707.2.tgz
        sha256: a6d0b46d71358db2d602324c553366a58fa1d031f5dfa12c09a35b6be17fe503
        size: 9270694
        format: npm-tgz
        bin: lib/tsgo
    launch: ["{bin}", "--lsp", "--stdio"]
    workspace_folders: true

  - name: gopls
    # No macOS binary upstream; built by us (docs/code-intel.md §4.2):
    # scripts/build-servers.sh + .github/workflows/servers.yml, pinned to
    # that workflow's published build.
    version: "0.24.0"
    detect: [["gopls", "version"]]
    download:
      darwin-arm64:
        url: https://github.com/JeanIsahakyan/theodore/releases/download/servers-68915d68b083/gopls-0.24.0-darwin-arm64.tar.gz
        sha256: 56c92b7c0835b512cd94f532c5a494345d4666fefc49cb174a469910e23e776d
        size: 21605310
        format: tar.gz
        bin: gopls
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}"]
    workspace_folders: true

  - name: clangd
    version: "23.1.0"
    detect: [["clangd", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/clangd/clangd/releases/download/23.1.0/clangd-mac-23.1.0.zip
        sha256: 1082e6638223b785ca2daf0939f13afcd0bb95c84ee9a4bbaff4745365159253
        size: 100060151
        format: zip
        bin: clangd_23.1.0/bin/clangd
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}"]
    workspace_folders: false

  - name: sourcekit-lsp
    # Ships with Xcode / the Swift toolchain; found through `xcrun --find`.
    detect: [["sourcekit-lsp"]]
    launch: ["{bin}"]
    workspace_folders: true
    hint: Install Xcode or the Swift toolchain

  - name: zls
    # Upstream only publishes .tar.xz for darwin-arm64 (zigtools/zls
    # release 0.17.0); ArchiveFormat has no xz variant (tar.gz, zip, gz,
    # binary, npm-tgz, wheel — crates/code-intel-toolchain/src/manifest.rs),
    # so there is no `download` here yet. Detect-only until that format
    # exists: found on the machine, never downloaded (docs/code-intel.md
    # §4.3 right column, same as sourcekit-lsp above).
    detect: [["zls", "--version"]]
    launch: ["{bin}"]
    workspace_folders: true
    hint: brew install zls

  - name: lua-language-server
    version: "3.19.2"
    detect: [["lua-language-server", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-darwin-arm64.tar.gz
        sha256: 79149584320a23bd5fcd5bc31f47a1975acd8a4560a0e89036bb1016fa61687f
        size: 3286148
        format: tar.gz
        bin: bin/lua-language-server
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}"]
    workspace_folders: true

  - name: taplo
    version: "0.10.0"
    detect: [["taplo", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-darwin-aarch64.gz
        sha256: 713734314c3e71894b9e77513c5349835eefbd52908445a0d73b0c7dc469347d
        size: 4616415
        format: gz
        bin: taplo
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}", "lsp", "stdio"]
    workspace_folders: true

  - name: marksman
    version: "2026-02-08"
    detect: [["marksman", "--version"]]
    download:
      darwin-arm64:
        # A universal binary (x86_64 + arm64); one asset for both Mac
        # platforms.
        url: https://github.com/artempyanykh/marksman/releases/download/2026-02-08/marksman-macos
        sha256: 6a801c17b5ac0dba69787c5282b3b3bd416e66c96253fae098d311c6bbd1833b
        size: 43856208
        format: binary
        bin: marksman
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}", "server"]
    workspace_folders: true

  - name: terraform-ls
    version: "0.39.1"
    detect: [["terraform-ls", "--version"]]
    download:
      darwin-arm64:
        # HashiCorp's own CDN, not GitHub releases: it answers the asset
        # directly, no redirect, so no redirect_hosts.
        url: https://releases.hashicorp.com/terraform-ls/0.39.1/terraform-ls_0.39.1_darwin_arm64.zip
        sha256: 07748aa989fc3b9f6e4538ff83bc2e607ebc20c7587ce6556ae555d631e70b1b
        size: 34111708
        format: zip
        bin: terraform-ls
    launch: ["{bin}", "serve"]
    workspace_folders: true

  - name: intelephense
    # Detect-only on purpose. Its licence is proprietary ("personal,
    # non-transferable", "by installing this software you agree"), for an
    # individual using it with an IDE or editor: yours to accept, not a
    # download behind Theodore's prompt or `install: always`. Parses PHP in
    # JavaScript and runs none of the project's code, so it may serve
    # reviews (a phpactor-tripping vendor/composer does nothing here).
    # Keeps an index under ~/.config/intelephense, which Remove can't touch.
    # `intelephense --version` waits on stdio: only check it exists.
    detect: [["intelephense"]]
    launch: ["{bin}", "--stdio"]
    requires: { runtime: node, min: 20 }
    hint: npm install -g intelephense

  - name: phpactor
    # MIT. A phar with a php shebang, so `{bin}` runs for a download and a
    # system install alike; PATH brings the php that passed the check. Needs
    # 8.2 (its vendor/composer/platform_check.php).
    # Trusted only: it `require`s the project's vendor/composer/autoload_*.php
    # (a marker file in them is written). `composer.enable: false`, through
    # initializationOptions or --config-extra, did not stop that. A project's
    # .phpactor.json it loads only after a trust prompt, and we answer none.
    version: "2026.10.07.0"
    detect: [["phpactor", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/phpactor/phpactor/releases/download/2026.10.07.0/phpactor.phar
        sha256: b28bf6166e016d539fc2f2aec18ef918b12590e436a6f1ccbdf30b5bbdbdb16b
        size: 4815663
        format: binary
        bin: phpactor.phar
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    # The index goes under {data}, not ~/.cache/phpactor: Remove deletes it.
    launch: ["{bin}", "language-server", '--config-extra={"indexer.index_path": "{data}/index"}']
    requires: { runtime: php, min: "8.2" }
    trusted_only: true

  - name: ruby-lsp
    # A gem with native dependencies and no standalone build: detect-only.
    # Trusted only: on start it composes .ruby-lsp/Gemfile, runs Bundler and
    # evaluates the project's Gemfile (a marker file in it is written), and
    # loads add-ons from the bundle; there is no option to turn that off.
    # That first start installs gems, hence the long timeout. A Gemfile with
    # no Gemfile.lock makes it exit: the syntax layer answers.
    detect: [["ruby-lsp", "--version"]]
    launch: ["{bin}"]
    requires: { runtime: ruby, min: 3 }
    hint: gem install ruby-lsp
    trusted_only: true
    start_timeout_secs: 300

  - name: jdtls
    # Eclipse JDT LS, EPL-2.0. Pure Java, so the same tarball runs anywhere a
    # JVM does; config_mac_arm makes this entry arm64 only. No `detect`: a
    # system jdtls is a Python wrapper with another command line.
    # `-configuration` must be writable and a running instance locks it, so
    # the shipped one is a read-only parent of one per worktree. One process
    # per worktree: Eclipse project names would collide across folders.
    version: "1.63.0"
    download:
      darwin-arm64:
        url: https://download.eclipse.org/jdtls/milestones/1.63.0/jdt-language-server-1.63.0-202610191322.tar.gz
        sha256: b1f2abe0b3cccb462cf64fb4a5587c7d09df60cf8be7748b152cbd89d018bdc4
        size: 51143565
        format: tar.gz
        bin: plugins/org.eclipse.equinox.launcher_1.8.0.v20260804-1928.jar
    launch:
      - "{runtime}"
      - -Declipse.application=org.eclipse.jdt.ls.core.id1
      - -Dosgi.bundles.defaultStartLevel=4
      - -Declipse.product=org.eclipse.jdt.ls.core.product
      - -Dosgi.sharedConfiguration.area={dir}/config_mac_arm
      - -Dosgi.sharedConfiguration.area.readOnly=true
      - -Dosgi.checkConfiguration=true
      - -Dosgi.configuration.cascaded=true
      # Without it .project, .classpath and .settings land in the worktree. A
      # JVM property: as a setting in init_options it does nothing.
      - -Djava.import.generatesMetadataFilesAtProjectRoot=false
      # What its own bin/jdtls adds on Java 24+; harmless below.
      - -Djdk.xml.maxGeneralEntitySizeLimit=0
      - -Djdk.xml.totalEntitySizeLimit=0
      - -Xmx2G
      - --add-modules=ALL-SYSTEM
      - --add-opens
      - java.base/java.util=ALL-UNNAMED
      - --add-opens
      - java.base/java.lang=ALL-UNNAMED
      - -jar
      - "{bin}"
      - -configuration
      - "{data}/config"
      - -data
      - "{data}/workspace"
    requires: { runtime: java, min: 21 }
    start_timeout_secs: 600
    # With its defaults it evaluates build.gradle and settings.gradle, and
    # runs an annotation processor a .factorypath names; marker files in them
    # are written. With these, neither is, and definition and references
    # still answer: sources are read as loose files, with no dependencies.
    review_init_options:
      settings:
        java:
          import:
            gradle: { enabled: false, wrapper: { enabled: false } }
            maven: { enabled: false }
            exclusions: ["**"]
          autobuild: { enabled: false }

  - name: kotlin-lsp
    # JetBrains', Apache-2.0 repository, alpha, and "partially closed-source"
    # by its README: the archive is theirs, fetched from their CDN. Brings
    # its own JBR, so no `requires`, at a price: 360 MB down, 1.1 GB unpacked.
    # `.sit` here is a plain zip. Sends nothing (--data-sharing defaults to none).
    # Trusted only: it imports through Gradle or Maven, which evaluates the
    # build (a marker file in settings.gradle.kts is written), with no
    # documented switch.
    version: "263.7084.0"
    detect: [["kotlin-lsp", "--version"]]
    download:
      darwin-arm64:
        url: https://download.jetbrains.com/language-server/kotlin-server/263.7084.0/kotlin-server-263.7084.0-aarch64.sit
        sha256: b403bf8a54bd458e3ba6731cf8abb3340be08b439c03576dfc02b13faf3694b8
        size: 360201117
        format: zip
        bin: kotlin-server-263.7084.0/bin/intellij-server
        redirect_hosts: [download-cdn.jetbrains.com]
    launch: ["{bin}", "--stdio", "--system-path={data}/system"]
    trusted_only: true
    start_timeout_secs: 600

  - name: csharp-ls
    # MIT, razzmatazz/csharp-language-server, a dotnet tool: its nupkg is a
    # zip with a framework-dependent, any-architecture dll. Chosen because it
    # is the one seen answering over plain stdio with an SDK alone. OmniSharp
    # 2.0.0's arm64 build wants an arm64 .NET, and the machine tried had x64
    # (Rosetta); Roslyn's roslyn-language-server is prerelease only, per
    # platform, and its thin client did not start through `dotnet`. Neither
    # was seen to answer, which says little against them on another machine.
    # MSBuild needs an SDK, not just the runtime.
    # No `detect`: a system tool has another command line.
    # Trusted only: MSBuild evaluates the project and runs its targets (an
    # <Exec> marker in a .csproj is written), and writes bin/ and obj/ into
    # the worktree; there is no option to turn that off. It announces loading
    # about 1.3 s after `initialized`: too close to the default settle.
    version: "0.28.0"
    download:
      darwin-arm64:
        url: https://api.nuget.org/v3-flatcontainer/csharp-ls/0.28.0/csharp-ls.0.28.0.nupkg
        sha256: 8f815e4f22674106a8244beba07e4b4b062e31528e404aa8489312effb8c0e0c
        size: 21643814
        format: zip
        bin: tools/net10.0/any/CSharpLanguageServer.dll
    launch: ["{runtime}", "{bin}"]
    requires: { runtime: dotnet-sdk, min: 10 }
    trusted_only: true
    start_timeout_secs: 300
    ready_settle_secs: 5

languages:
  - id: rust
    globs: ["*.rs"]
    servers: [rust-analyzer]
  - id: typescript
    globs: ["*.ts", "*.mts", "*.cts"]
    tags_extends: javascript
    servers: [tsgo, typescript-language-server]
  - id: tsx
    globs: ["*.tsx"]
    lsp_id: typescriptreact
    tags_extends: javascript
    servers: [tsgo, typescript-language-server]
  - id: javascript
    globs: ["*.js", "*.mjs", "*.cjs", "*.jsx"]
    servers: [tsgo, typescript-language-server]
  - id: python
    globs: ["*.py", "*.pyi"]
    servers: [ty, pyright]
  - id: go
    globs: ["*.go"]
    servers: [gopls]
  - id: c
    globs: ["*.c", "*.h"]
    servers: [clangd]
  - id: cpp
    globs: ["*.cc", "*.cpp", "*.cxx", "*.c++", "*.hh", "*.hpp", "*.hxx", "*.h++", "*.ipp"]
    servers: [clangd]
  - id: swift
    globs: ["*.swift"]
    servers: [sourcekit-lsp]
  - id: zig
    globs: ["*.zig", "*.zon"]
    servers: [zls]
  - id: lua
    globs: ["*.lua"]
    servers: [lua-language-server]
  - id: php
    globs: ["*.php", "*.phtml"]
    servers: [intelephense, phpactor]

  - id: ruby
    globs: ["*.rb", "*.rake", "*.gemspec", "*.ru", "Gemfile", "Rakefile"]
    servers: [ruby-lsp]

  - id: java
    globs: ["*.java"]
    servers: [jdtls]

  - id: kotlin
    globs: ["*.kt", "*.kts"]
    servers: [kotlin-lsp]

  - id: csharp
    globs: ["*.cs", "*.csx"]
    servers: [csharp-ls]

  - id: json
    prose: true
    globs: ["*.json", "*.jsonc"]
  - id: yaml
    prose: true
    globs: ["*.yaml", "*.yml"]
  - id: toml
    prose: true
    globs: ["*.toml"]
    servers: [taplo]
  - id: markdown
    prose: true
    globs: ["*.md", "*.markdown"]
    servers: [marksman]
  - id: terraform
    globs: ["*.tf", "*.tfvars"]
    servers: [terraform-ls]
  - id: dockerfile
    globs: ["Dockerfile", "Dockerfile.*", "*.dockerfile"]
  - id: bash
    # No language server pinned yet (bash-language-server needs Node and
    # is not in scope here); the grammar (when CI builds one — another
    # agent's grammars.toml entry) and text search still work without one.
    globs: ["*.sh", "*.bash", ".bashrc", ".bash_profile", ".bash_aliases"]

  # Text-only languages: no grammar and no server (yet), listed so their
  # files are code the text fallback searches (a code query finds `def
  # foo`, `sub foo`, `defmodule Foo` by name, docs/code-intel.md §3). Adding
  # a grammar or a server later is the same entry plus one line elsewhere.
  # Appended after every language above: the first language whose glob
  # matches wins, so none of these can take a file from an earlier one
  # (`*.h` stays C, `*.kts` Kotlin).
  - id: scala
    globs: ["*.scala", "*.sc", "*.sbt"]
  - id: elixir
    globs: ["*.ex", "*.exs"]
  - id: dart
    globs: ["*.dart"]
  - id: vue
    globs: ["*.vue"]
  - id: svelte
    globs: ["*.svelte"]
  - id: html
    # Markup and content, not code: a name in an HTML file is almost always
    # text or an attribute, never the definition of a symbol, so a text hit
    # there is noise. Not searched by a code query.
    prose: true
    globs: ["*.html", "*.htm"]
  - id: css
    # Code, unlike HTML: class names, custom properties and keyframes are
    # defined here and used from other languages' files.
    globs: ["*.css"]
  - id: scss
    # Mixins, functions and variables are real definitions.
    globs: ["*.scss", "*.sass"]
  - id: sql
    # Code: tables, views, functions and procedures are defined here (and
    # migrations are a large part of what a change touches).
    globs: ["*.sql"]
  - id: objective-c
    globs: ["*.m", "*.mm"]
  - id: perl
    globs: ["*.pl", "*.pm"]
  - id: haskell
    globs: ["*.hs", "*.lhs"]
  - id: ocaml
    globs: ["*.ml", "*.mli"]
  - id: clojure
    globs: ["*.clj", "*.cljs", "*.cljc"]
  - id: erlang
    globs: ["*.erl", "*.hrl"]
  - id: r
    globs: ["*.r", "*.R"]
  - id: julia
    globs: ["*.jl"]
  - id: groovy
    globs: ["*.groovy", "*.gvy", "*.gradle"]
  - id: powershell
    globs: ["*.ps1", "*.psm1", "*.psd1"]
  - id: solidity
    globs: ["*.sol"]
