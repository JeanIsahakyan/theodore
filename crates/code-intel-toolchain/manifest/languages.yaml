# Languages and their language servers (docs/code-intel.md §3). Hand-written,
# pinned versions. Grammar entries are not here: CI generates them into
# grammars.json next to this file.
#
# servers[]:
#   detect     alternatives, each an argv; first one that runs wins. A
#              one-element argv only checks that the program exists.
#   download   per platform; sha256 is required (an entry without it is
#              dropped). redirect_hosts: the only hosts the URL may redirect to.
#   launch     argv; "{bin}" is replaced by the resolved binary.
#   review_init_options  merged over init_options in a review run (§8). They
#              narrow what a server runs; they do not make it safe: rust-analyzer
#              still runs `cargo metadata` (a PR's .cargo/config.toml
#              `rustc-wrapper`, rust-toolchain.toml), typescript-language-server
#              loads node_modules/typescript. Hence review runs start servers
#              only when `code_intel.lsp.review` is on (off by default).
# languages[]: globs match the file name (`*.rs`, `Dockerfile`); a glob with a
#   `/` matches the repo-relative path. First language whose glob matches wins.
#   tags_extends  a language whose tags query is prepended to this one's
#              (upstream TypeScript tags.scm is written to extend JavaScript's).

servers:
  - name: rust-analyzer
    version: "2026-10-26"
    detect: [["rust-analyzer", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-26/rust-analyzer-aarch64-apple-darwin.gz
        sha256: 8fb90cb58f5910d8d8b24ac1a93cca49f053365cbf0eb3c682144ad0a0027dcf
        size: 14092361
        format: gz
        bin: rust-analyzer
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
      darwin-x64:
        url: https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-26/rust-analyzer-x86_64-apple-darwin.gz
        sha256: b3e4904877bcf7013a4a342c449cff1bf0ea0b91d5a1a30ac8df3d32142519c0
        size: 14821659
        format: gz
        bin: rust-analyzer
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}"]
    workspace_folders: true
    # Build scripts, proc macros and `cargo check` run the project's code.
    review_init_options:
      cargo: { buildScripts: { enable: false } }
      procMacro: { enable: false }
      checkOnSave: false

  - name: ty
    version: "0.0.95"
    detect: [["ty", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/astral-sh/ty/releases/download/0.0.95/ty-aarch64-apple-darwin.tar.gz
        sha256: 379d341e8fb12d949e92fa7142f864cde835be5b2c1378d24c264a928c551857
        size: 13068441
        format: tar.gz
        bin: ty-aarch64-apple-darwin/ty
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}", "server"]
    workspace_folders: true

  - name: pyright
    # `pyright-langserver --version` waits on stdio: only check it exists.
    detect: [["pyright-langserver"]]
    launch: ["{bin}", "--stdio"]
    workspace_folders: true
    requires: node

  - name: typescript-language-server
    detect: [["typescript-language-server", "--version"]]
    launch: ["{bin}", "--stdio"]
    workspace_folders: true
    requires: node
    review_init_options:
      plugins: []
      disableAutomaticTypingAcquisition: true

  - name: tsgo
    # TypeScript's native-preview compiler/language service (tsgo). Its
    # LSP mode is verified for definition/references/documentSymbol
    # (crates/code-intel-toolchain/tests/tsgo_lsp.rs, run with --ignored)
    # against this crate's own package: it answers all three. Listed ahead
    # of typescript-language-server (docs/code-intel.md §11 open question
    # resolved: default for TypeScript).
    version: "7.0.0-dev.20260707.2"
    detect: [["tsgo", "--version"]]
    download:
      darwin-arm64:
        # The npm package is platform-specific
        # (@typescript/native-preview-darwin-arm64); the generic
        # @typescript/native-preview just execs this one's binary.
        url: https://registry.npmjs.org/@typescript/native-preview-darwin-arm64/-/native-preview-darwin-arm64-7.0.0-dev.20260707.2.tgz
        sha256: a6d0b46d71358db2d602324c553366a58fa1d031f5dfa12c09a35b6be17fe503
        size: 9270694
        format: npm-tgz
        bin: lib/tsgo
    launch: ["{bin}", "--lsp", "--stdio"]
    workspace_folders: true

  - name: gopls
    # No macOS binary upstream; built by us (docs/code-intel.md §4.2),
    # scripts/build-servers.sh + .github/workflows/servers.yml. The url and
    # sha256 below are from a local `sh scripts/build-servers.sh` run
    # (go1.27.2, go install -trimpath golang.org/x/tools/gopls@v0.24.0),
    # just to prove the pin builds — NOT the published asset. Once
    # servers.yml runs on staging it publishes its own build under this
    # release tag; a human must paste that run's sha256
    # (target/servers/gopls-manifest-snippet.yaml in its job log/artifact)
    # over this placeholder before relying on it (CI's build is not
    # guaranteed byte-identical to this one even with -trimpath: Go
    # toolchain version, embedded build id).
    version: "0.24.0"
    detect: [["gopls", "version"]]
    download:
      darwin-arm64:
        url: https://github.com/JeanIsahakyan/theodore/releases/download/servers-68915d68b083/gopls-0.24.0-darwin-arm64.tar.gz
        sha256: 82428507402863944e8a0bfec16e458b55f392800221b4c432a052b9db451b0e
        size: 21604981
        format: tar.gz
        bin: gopls
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}"]
    workspace_folders: true

  - name: clangd
    version: "23.1.0"
    detect: [["clangd", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/clangd/clangd/releases/download/23.1.0/clangd-mac-23.1.0.zip
        sha256: 1082e6638223b785ca2daf0939f13afcd0bb95c84ee9a4bbaff4745365159253
        size: 100060151
        format: zip
        bin: clangd_23.1.0/bin/clangd
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}"]
    workspace_folders: false

  - name: sourcekit-lsp
    # Ships with Xcode / the Swift toolchain; found through `xcrun --find`.
    detect: [["sourcekit-lsp"]]
    launch: ["{bin}"]
    workspace_folders: true

  - name: zls
    # Upstream only publishes .tar.xz for darwin-arm64 (zigtools/zls
    # release 0.17.0); ArchiveFormat has no xz variant (tar.gz, zip, gz,
    # binary, npm-tgz, wheel — crates/code-intel-toolchain/src/manifest.rs),
    # so there is no `download` here yet. Detect-only until that format
    # exists: found on the machine, never downloaded (docs/code-intel.md
    # §4.3 right column, same as sourcekit-lsp above).
    detect: [["zls", "--version"]]
    launch: ["{bin}"]
    workspace_folders: true

  - name: lua-language-server
    version: "3.19.2"
    detect: [["lua-language-server", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-darwin-arm64.tar.gz
        sha256: 79149584320a23bd5fcd5bc31f47a1975acd8a4560a0e89036bb1016fa61687f
        size: 3286148
        format: tar.gz
        bin: bin/lua-language-server
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}"]
    workspace_folders: true

  - name: taplo
    version: "0.10.0"
    detect: [["taplo", "--version"]]
    download:
      darwin-arm64:
        url: https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-darwin-aarch64.gz
        sha256: 713734314c3e71894b9e77513c5349835eefbd52908445a0d73b0c7dc469347d
        size: 4616415
        format: gz
        bin: taplo
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}", "lsp", "stdio"]
    workspace_folders: true

  - name: marksman
    version: "2026-02-08"
    detect: [["marksman", "--version"]]
    download:
      darwin-arm64:
        # A universal binary (x86_64 + arm64); one asset for both Mac
        # platforms.
        url: https://github.com/artempyanykh/marksman/releases/download/2026-02-08/marksman-macos
        sha256: 6a801c17b5ac0dba69787c5282b3b3bd416e66c96253fae098d311c6bbd1833b
        size: 43856208
        format: binary
        bin: marksman
        redirect_hosts: [release-assets.githubusercontent.com, objects.githubusercontent.com]
    launch: ["{bin}", "server"]
    workspace_folders: true

  - name: terraform-ls
    version: "0.39.1"
    detect: [["terraform-ls", "--version"]]
    download:
      darwin-arm64:
        # HashiCorp's own CDN, not GitHub releases: it answers the asset
        # directly, no redirect, so no redirect_hosts.
        url: https://releases.hashicorp.com/terraform-ls/0.39.1/terraform-ls_0.39.1_darwin_arm64.zip
        sha256: 07748aa989fc3b9f6e4538ff83bc2e607ebc20c7587ce6556ae555d631e70b1b
        size: 34111708
        format: zip
        bin: terraform-ls
    launch: ["{bin}", "serve"]
    workspace_folders: true

languages:
  - id: rust
    globs: ["*.rs"]
    servers: [rust-analyzer]
  - id: typescript
    globs: ["*.ts", "*.mts", "*.cts"]
    tags_extends: javascript
    servers: [tsgo, typescript-language-server]
  - id: tsx
    globs: ["*.tsx"]
    lsp_id: typescriptreact
    tags_extends: javascript
    servers: [tsgo, typescript-language-server]
  - id: javascript
    globs: ["*.js", "*.mjs", "*.cjs", "*.jsx"]
    servers: [typescript-language-server]
  - id: python
    globs: ["*.py", "*.pyi"]
    servers: [ty, pyright]
  - id: go
    globs: ["*.go"]
    servers: [gopls]
  - id: c
    globs: ["*.c", "*.h"]
    servers: [clangd]
  - id: cpp
    globs: ["*.cc", "*.cpp", "*.cxx", "*.c++", "*.hh", "*.hpp", "*.hxx", "*.h++", "*.ipp"]
    servers: [clangd]
  - id: swift
    globs: ["*.swift"]
    servers: [sourcekit-lsp]
  - id: zig
    globs: ["*.zig", "*.zon"]
    servers: [zls]
  - id: lua
    globs: ["*.lua"]
    servers: [lua-language-server]
  - id: json
    globs: ["*.json", "*.jsonc"]
  - id: yaml
    globs: ["*.yaml", "*.yml"]
  - id: toml
    globs: ["*.toml"]
    servers: [taplo]
  - id: markdown
    globs: ["*.md", "*.markdown"]
    servers: [marksman]
  - id: terraform
    globs: ["*.tf", "*.tfvars"]
    servers: [terraform-ls]
  - id: dockerfile
    globs: ["Dockerfile", "Dockerfile.*", "*.dockerfile"]
  - id: bash
    # No language server pinned yet (bash-language-server needs Node and
    # is not in scope here); the grammar (when CI builds one — another
    # agent's grammars.toml entry) and text search still work without one.
    globs: ["*.sh", "*.bash", ".bashrc", ".bash_profile", ".bash_aliases"]
