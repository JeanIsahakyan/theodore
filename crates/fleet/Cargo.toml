[package]
name = "theodore-fleet"
description = "Fleet link over a WebSocket (docs/fleet.md \"Connect\"): challenge/hello, reconnect, heartbeat, reauth and outbox behind the FleetPort."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
theodore-ports.workspace = true
theodore-fleet-protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
url.workspace = true
tokio-tungstenite.workspace = true
# The same TLS stack as reqwest: rustls on aws-lc-rs with the OS trust
# store. Both already in the tree through reqwest.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
fastrand = "2"

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
