[package]
name = "theodore-code-intel"
description = "Code intelligence facade: CodeIntelPort over the syntax index, language servers and the toolchain, with routing and fallbacks."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
theodore-ports.workspace = true
theodore-code-intel-toolchain.workspace = true
theodore-code-intel-syntax.workspace = true
theodore-code-intel-lsp.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tree-sitter.workspace = true
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tempfile.workspace = true
pretty_assertions.workspace = true

[[bin]]
# The scripted language server of code-intel-lsp's tests, built again here
# under another name so this crate's integration tests get its path
# (`CARGO_BIN_EXE_code-intel-fake-lsp`); Cargo exposes only a package's own
# binaries to its tests.
name = "code-intel-fake-lsp"
path = "../code-intel-lsp/src/bin/fake-lsp.rs"
test = false
doc = false

[lints]
workspace = true
