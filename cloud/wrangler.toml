# Theodore cloud (docs/cloud.md). One Worker per channel; each talks to its
# own WorkOS environment. Secrets are never in this file:
#   wrangler secret put WORKOS_API_KEY --env staging
#   wrangler secret put WORKOS_API_KEY --env production
# Local `wrangler dev` reads WORKOS_API_KEY from .dev.vars (gitignored).
name = "theodore-cloud"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# The fleet hub, one Durable Object per org (docs/cloud.md "Fleet"). Bindings
# aren't inherited by environments, so each repeats it; migrations are
# top-level and apply to every environment's Worker.
[[durable_objects.bindings]]
name = "ORG_HUB"
class_name = "OrgHub"

# Rate limits (src/index.ts): per client IP for the routes without a session,
# per user for the org routes. Each environment has its own counters.
[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_USER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgHub"]

[env.staging]
name = "theodore-cloud-staging"
vars = { WORKOS_CLIENT_ID = "client_01M5RM1W36AHHEGBE37QD3PS6K", WORKOS_API_BASE = "https://api.workos.com" }
durable_objects.bindings = [{ name = "ORG_HUB", class_name = "OrgHub" }]
ratelimits = [
  { name = "RL_PUBLIC", namespace_id = "1101", simple = { limit = 30, period = 60 } },
  { name = "RL_USER", namespace_id = "1102", simple = { limit = 120, period = 60 } },
]

[env.production]
name = "theodore-cloud"
vars = { WORKOS_CLIENT_ID = "client_01M5RMBK860S2JJZNWJDDSH0BM", WORKOS_API_BASE = "https://api.workos.com" }
durable_objects.bindings = [{ name = "ORG_HUB", class_name = "OrgHub" }]
ratelimits = [
  { name = "RL_PUBLIC", namespace_id = "1201", simple = { limit = 30, period = 60 } },
  { name = "RL_USER", namespace_id = "1202", simple = { limit = 120, period = 60 } },
]
