# Git hooks. Install once per clone: `lefthook install`.
# Skip in an emergency: `LEFTHOOK=0 git commit ...`.

pre-commit:
  parallel: true
  commands:
    whitespace-and-conflicts:
      # Trailing whitespace, blank lines at EOF, leftover conflict markers.
      run: git diff --cached --check
    large-files:
      run: scripts/check-large-files.sh {staged_files}
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt -- --check {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: scripts/check-commit-msg.sh {1}

# Slower checks: full workspace, not just what's staged. Run before sharing
# work, not on every commit.
pre-push:
  commands:
    rust-clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
    rust-test:
      run: cargo test --workspace
    ui-typecheck:
      # No-op until ui/ is scaffolded.
      run: '[ ! -f ui/package.json ] || pnpm -C ui typecheck'
    ui-lint:
      run: '[ ! -f ui/package.json ] || pnpm -C ui lint'
