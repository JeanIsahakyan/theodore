[[grammar]]
package = "tree-sitter-php"
repo = "https://github.com/tree-sitter/tree-sitter-php.git"
tag = "v0.25.1"
rev = "58d5643086ae60e93a3746cca648363ee97c8761"
version = "0.25.1"
tags_query = "queries/tags.scm"
# Upstream's query has no enums (PHP 8.1) and no nullsafe calls
# (`$a?->run()`) — see the comment at the top of php-tags.scm. Appended:
# its classes, interfaces, traits, functions, methods and calls stay.
tags_query_local = "crates/code-intel-toolchain/queries/php-tags.scm"
tags_query_local_mode = "append"

# The package ships two grammars, `php` (files with `<?php` and inline HTML)
# and `php_only` (no HTML). Only `php` is listed: `*.php` files are `php`,
# and a `php_only` entry would be a grammar id the manifest has no language
# for (an "unknown language" warning when CI generates grammars.json).
[[grammar.languages]]
id = "php"
symbol = "tree_sitter_php"
src = "php/src"

