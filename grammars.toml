# Pinned tree-sitter grammar sources for `scripts/build-grammars.sh`
# (docs/code-intel.md §4.1).
#
# One [[grammar]] per upstream package, one dylib per package. A package
# with several grammars (e.g. tree-sitter-typescript ships `typescript` and
# `tsx`) compiles all of them into that one dylib — their parsers and
# external scanners use distinct `tree_sitter_*` symbol names, so they never
# collide.
#
# Fields:
#   package      upstream package name, used in the dylib file name
#   repo         git URL to shallow-fetch
#   tag          the upstream release tag `rev` was resolved from — for
#                humans bumping the pin; the build only ever reads `rev`.
#   rev          full commit sha the tag pointed to when pinned (pin by sha,
#                not by tag, so a re-tag upstream can't change what we
#                build). Resolve with `git ls-remote --tags <repo>` and take
#                the peeled `refs/tags/<tag>^{}` line's sha when one exists
#                (an annotated tag: that line is the commit, the un-peeled
#                `refs/tags/<tag>` line is the *tag object*, not a commit) —
#                or just `git clone --depth 1 --branch <tag> <repo> && git
#                rev-parse HEAD`, which always resolves to the commit.
#                `build-grammars.sh` checks this on every run and fails loud
#                if a pinned rev and its tag ever disagree.
#   version      display version baked into file names and the manifest
#                (the tag with no leading "v")
#   [[grammar.languages]]
#     id         manifest language id (docs/code-intel.md §3)
#     symbol     the grammar's exported `TSLanguage *tree_sitter_<symbol>()`
#     src        directory, relative to the repo root, holding parser.c
#                (+ scanner.c if present) and tree_sitter/parser.h
#   tags_query   path to `tags.scm`, relative to the repo root, when the
#                grammar ships one. Omitted when it doesn't — see "no tags
#                query" below; the build then looks for
#                `crates/code-intel-toolchain/queries/<id>-tags.scm` in this
#                repo instead, and if that's missing too, skips packaging a
#                tags query for that language (symbols/refs just aren't
#                available yet, nothing fails).
#   tags_query_local
#                path to one of our own queries, relative to *this* repo's
#                root (not the grammar's checkout) — e.g.
#                "crates/code-intel-toolchain/queries/rust-tags.scm". Unlike
#                the automatic per-language fallback above (which only
#                kicks in when `tags_query` is absent), this key always
#                applies when set, on top of whatever `tags_query` names.
#   tags_query_local_mode
#                "replace" (default) or "append" — whether
#                `tags_query_local`'s content stands in for `tags_query`'s,
#                or is concatenated after it (upstream's patterns still
#                run, ours run in addition — tree-sitter-tags unions every
#                pattern in a `tags.scm`, so this just needs the bytes of
#                both files, in order). Ignored without `tags_query_local`.
#                A package with several languages applies the same
#                tags_query_local / mode to all of them (matching how
#                `tags_query` is already shared, e.g. typescript + tsx).
#
# No tags query upstream, falls back to our own
# (crates/code-intel-toolchain/queries/<id>-tags.scm):
#   json, yaml, toml, bash, markdown, kotlin. markdown_inline has no definitions or
#   references of its own (it's emphasis/links inside a block markdown
#   already tagged) and is skipped — no markdown_inline-tags.scm.
#
# The release tag (below, GRAMMARS_RELEASE_TAG) is content-addressed from
# this file's bytes *and* every file under crates/code-intel-toolchain/
# queries/ — editing a query here, with no other change, still produces a
# new tag, so CI publishes new tags.scm assets under it.
#
# tree-sitter-swift pins the `-with-generated-files` tag, not the plain
# release tag: alex-pinkus/tree-sitter-swift does not commit the generated
# `src/parser.c` on its normal tags (it's `.gitignore`d there and built by
# `tree-sitter generate` in their CI); the `-with-generated-files` tag is a
# second tag, at a different commit, with the generated parser committed so
# consumers like us don't need the tree-sitter CLI or Node to build it.

[[grammar]]
package = "tree-sitter-rust"
repo = "https://github.com/tree-sitter/tree-sitter-rust.git"
tag = "v0.24.2"
rev = "77a3747266f4d621d0757825e6b11edcbf991ca5"
version = "0.24.2"
tags_query = "queries/tags.scm"
# Upstream's query misses scoped calls (`Foo::new()`) and impl containers
# whose trait/type is scoped or generic (`impl fmt::Display for X`,
# `impl Foo<T> for X`, `impl Foo<T> { .. }`) — see the comment at the top
# of rust-tags.scm. Appended, not a replacement: upstream's definitions
# (struct/enum/fn/trait/mod/macro) and its plain calls and impls are still
# good and there is no reason to duplicate them by hand.
tags_query_local = "crates/code-intel-toolchain/queries/rust-tags.scm"
tags_query_local_mode = "append"

[[grammar.languages]]
id = "rust"
symbol = "tree_sitter_rust"
src = "src"

[[grammar]]
package = "tree-sitter-typescript"
repo = "https://github.com/tree-sitter/tree-sitter-typescript.git"
