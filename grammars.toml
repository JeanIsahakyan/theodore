[[grammar]]
package = "tree-sitter-c-sharp"
repo = "https://github.com/tree-sitter/tree-sitter-c-sharp.git"
tag = "v0.23.5"
rev = "cac6d5fb595f5811a076336682d5d595ac1c9e85"
version = "0.23.5"
# Upstream's queries/tags.scm is not usable as shipped: it ends with a
# `@module` capture that tree-sitter-tags rejects, so the whole query fails
# to compile. `tags_query` is therefore not set; our own csharp-tags.scm
# replaces it (upstream's valid patterns, minus the bad one, plus structs,
# enums, records, properties, local functions, file-scoped namespaces and
# plain calls — see the comment at the top of that file).
tags_query_local = "crates/code-intel-toolchain/queries/csharp-tags.scm"
tags_query_local_mode = "replace"

# The exported C symbol is `tree_sitter_c_sharp`, the manifest id `csharp`.
[[grammar.languages]]
id = "csharp"
symbol = "tree_sitter_c_sharp"
src = "src"
