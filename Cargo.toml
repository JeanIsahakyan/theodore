[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# internal
theodore-domain = { path = "crates/domain" }
theodore-ports = { path = "crates/ports" }
theodore-contract = { path = "crates/contract" }
theodore-app = { path = "crates/app" }
theodore-host-http = { path = "crates/host-http" }
theodore-host-github = { path = "crates/host-github" }
theodore-git = { path = "crates/git" }
theodore-agents = { path = "crates/agents" }
theodore-mcp = { path = "crates/mcp" }
theodore-store = { path = "crates/store" }
theodore-secrets = { path = "crates/secrets" }
theodore-grouping = { path = "crates/grouping" }
theodore-telemetry = { path = "crates/telemetry" }

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
similar = "3"
regex = "1"
url = "2"
which = "8"
dirs = "6"

# types to TS
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
specta-serde = "0.0.12"
specta-util = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# adapters
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
cynic = { version = "3", features = ["http-reqwest"] }
cynic-codegen = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "transport-io"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }

# tauri (v2 stable line)
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# tests
tempfile = "3"
wiremock = "0.6"
pretty_assertions = "1"
