<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <title>Theodore DMG background</title>
  <!--
    The DMG window's background (apps/desktop/tauri.conf.json bundle.macOS.dmg).
    660 x 400 pt, the window size; Finder draws it under the icons at 1 pt = 1 px.
    The app icon lands centred on (180, 170), Applications on (480, 170); the
    arrow sits between them. The title bar takes ~32 pt of the window's
    height, so only the top 660 x 368 shows.
    No text: the two icons and their labels say what to do. No fill:
    Finder paints white under a picture background, in light and dark
    mode alike, so the arrow sits on white.
    Render: scripts/dmg-background.sh
  -->

  <!-- arrow: a dotted trail into a chevron, between the two icons -->
  <g fill="#3F86D6">
    <circle cx="276" cy="170" r="2.5" opacity="0.25"/>
    <circle cx="292" cy="170" r="2.5" opacity="0.4"/>
    <circle cx="308" cy="170" r="2.5" opacity="0.55"/>
    <circle cx="324" cy="170" r="2.5" opacity="0.7"/>
    <circle cx="340" cy="170" r="2.5" opacity="0.85"/>
  </g>
  <path d="M354 170H384M372 157L386 170L372 183" fill="none" stroke="#3F86D6"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
