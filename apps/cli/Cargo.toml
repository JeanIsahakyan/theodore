[package]
name = "theodore-cli"
description = "Headless `theodore` commands: grouping eval, debugging."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "theodore_cli"
path = "src/lib.rs"

[[bin]]
name = "theodore"
path = "src/main.rs"

[dependencies]
theodore-domain.workspace = true
theodore-ports.workspace = true
theodore-grouping.workspace = true
theodore-mcp.workspace = true
theodore-git.workspace = true
theodore-app.workspace = true
theodore-code-intel.workspace = true
theodore-host-github.workspace = true
theodore-agents.workspace = true
theodore-secrets.workspace = true
theodore-runtime = { path = "../../crates/runtime" }
theodore-sandbox = { path = "../../crates/sandbox" }
theodore-contract.workspace = true
rmcp.workspace = true
serde_yaml = "0.9"
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
regex.workspace = true
reqwest.workspace = true
async-trait.workspace = true
tokio-util.workspace = true

[dev-dependencies]
theodore-code-intel-toolchain.workspace = true
tree-sitter.workspace = true
tree-sitter-rust = "0.24"
rmcp = { workspace = true, features = ["client"] }

[lints]
workspace = true
