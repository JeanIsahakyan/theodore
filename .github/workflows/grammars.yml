name: Grammars

# Builds the tree-sitter grammar libraries pinned in grammars.toml
# (docs/code-intel.md §4.1) for every platform the manifest keys, and
# publishes them as a GitHub release's assets, plus the generated manifest
# fragment (grammars.json) as a workflow artifact.
#
#   grammars.toml ─▶ scripts/build-grammars.sh, once per platform:
#       macos-26         ─▶ *.dylib  (darwin-arm64, signed)
#       ubuntu-24.04     ─▶ *.so     (linux-x64)
#       ubuntu-24.04-arm ─▶ *.so     (linux-arm64)
#     each + *.tags.scm + a grammars.json listing its own platform
#   ─▶ publish: merge the three grammars.json (one entry per package, every
#       platform's download inside)
#     ─▶ release "grammars-<content hash of grammars.toml>" (prerelease)
#     ─▶ grammars.json (workflow artifact only — a human commits it,
#        in crates/code-intel-toolchain/manifest/, once this release exists)
#
# Manual (workflow_dispatch), or automatically when grammars.toml changes
# on staging (a grammar bump merged like anything else). Never on main or a
# PR: this never needs to run twice for the same pin, and the release tag
# is content-addressed so a re-run of the same pin republishes the same
# tag's assets rather than piling up releases.
#
# The release this makes is always `--prerelease` and `--latest=false`, and
# its tag never matches what the updater polls (`releases/latest/...`,
# `channel-staging`, `channel-beta` — docs/releasing.md "Branch flow" /
# "Staging channel"), so it can never be picked up as an app update.
#
# Secrets (optional, the same ones build.yml uses for Developer ID
# signing; the macOS leg only — a Linux library is not signed):
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY.
# Unset: dylibs are ad-hoc signed, same as the app is today
# (docs/code-intel.md §4.1, docs/releasing.md "Developer ID
# signing + notarization").

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - grammars.toml

concurrency:
  group: grammars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS matches build.yml / ci.yml's runner, so the dylibs are
          # built on the same SDK the app itself ships against.
          - { os: macos-26, platform: darwin-arm64 }
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Same pattern as build.yml's DMG-signing step: the cert only lives
      # in a throwaway keychain for this job.
      - name: import Developer ID certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/grammars-signing.keychain-db"
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          # codesign only treats an identity as valid (chain trusted) when its
          # keychain is in the search list; --keychain alone finds none.
          read -ra others <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "${others[@]}"
          echo "GRAMMARS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: build grammars
        env:
          CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          CODESIGN_KEYCHAIN: ${{ env.GRAMMARS_KEYCHAIN }}
        run: bash scripts/build-grammars.sh

      - name: delete signing keychain
        if: always() && runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        run: security delete-keychain "$GRAMMARS_KEYCHAIN" || true

      # Every leg's grammars.json carries the same release tag; `publish`
      # checks that and merges them.
      - uses: actions/upload-artifact@v4
        with:
          name: grammars-leg-${{ matrix.platform }}
          path: |
            target/grammars/*.dylib
            target/grammars/*.so
            target/grammars/*.tags.scm
            target/grammars/grammars.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grammars-leg-*
          path: legs

      # One manifest entry per package, every platform's download inside.
      # The legs must agree on everything but `downloads`: the same pin
      # built them, so a difference is a bug, not something to paper over.
      - name: merge the per-platform grammars.json
        run: |
          mkdir -p release
          python3 - <<'PY'
          import glob, json, shutil, sys

          legs = sorted(glob.glob("legs/*/grammars.json"))
          if len(legs) != 3:
              sys.exit(f"expected 3 platform manifests, found {legs}")
          merged = None
          for path in legs:
              m = json.load(open(path))
              if merged is None:
                  merged = m
                  continue
              if m["schema"] != merged["schema"] or m["release_tag"] != merged["release_tag"]:
                  sys.exit(f"{path}: schema or release tag differs from {legs[0]}")
              by_pkg = {g["package"]: g for g in merged["grammars"]}
              if sorted(by_pkg) != sorted(g["package"] for g in m["grammars"]):
                  sys.exit(f"{path}: a different set of packages than {legs[0]}")
              for g in m["grammars"]:
                  base = by_pkg[g["package"]]
                  rest = lambda x: {k: v for k, v in x.items() if k != "downloads"}
                  if rest(base) != rest(g):
                      sys.exit(f"{path}: {g['package']} differs outside downloads")
                  dup = set(base["downloads"]) & set(g["downloads"])
                  if dup:
                      sys.exit(f"{path}: {g['package']} builds for {sorted(dup)} twice")
                  base["downloads"].update(g["downloads"])
          for g in merged["grammars"]:
              g["downloads"] = dict(sorted(g["downloads"].items()))
          with open("release/grammars.json", "w") as f:
              json.dump(merged, f, indent=2)
              f.write("\n")
          print(merged["release_tag"], file=open("release/TAG", "w"))
          # The tags queries are byte-identical across legs (same sources):
          # one copy of each. Libraries are named per platform.
          for pat in ("*.dylib", "*.so", "*.tags.scm"):
              for p in glob.glob(f"legs/*/{pat}"):
                  shutil.copy(p, "release/")
          PY
          echo "tag=$(cat release/TAG)" >> "$GITHUB_OUTPUT"
        id: merge

      # A content-addressed tag (grammars-<hash of grammars.toml>): re-running
      # on an unchanged pin republishes the same tag's assets instead of
      # creating a new release every time.
      - name: publish the grammars release (prerelease, never "latest")
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.merge.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Grammars ($TAG)" \
              --notes "tree-sitter grammar libraries (macOS arm64 .dylib, Linux x64 and arm64 .so) built from grammars.toml at ${{ github.sha }}. Not an app release: never polled by the updater (docs/releasing.md)." \
              --prerelease \
              --latest=false
          fi
          shopt -s nullglob
          assets=(release/*.dylib release/*.so release/*.tags.scm)
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "${assets[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: grammars-manifest
          path: release/grammars.json
          if-no-files-found: error
