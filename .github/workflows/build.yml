name: Build

# Plan §11.1/§11.2. The one build both release workflows call:
# release.yml (push to main) and staging.yml (push to staging).
#
#   version ─┬─▶ build (macOS aarch64)  .dmg, .app.tar.gz + .sig ──┐
#            └─▶ linux (x86_64,         .AppImage + .sig,          ├─▶ manifest
#                       aarch64)        .deb + .sig ───────────────┘   + latest.json
#                                                                        │
#                                    one workflow artifact: theodore-<env> ◀─┘
#
# macOS is signed ad-hoc by default (Developer ID + notarization when the
# secrets below are set). Every updater asset is signed with
# TAURI_SIGNING_PRIVATE_KEY. Any platform failing fails the build: nothing
# is published half. Publishing is the caller's job.
#
# One-time setup for all of this to work: docs/releasing.md.
#
# Secrets (callers pass `secrets: inherit`):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (required)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  (optional)
# Variables:
#   THEODORE_OTLP_ENDPOINT, THEODORE_POSTHOG_HOST, THEODORE_POSTHOG_KEY
#                              remote telemetry sinks (optional, docs/telemetry.md)
# Secrets (telemetry, optional):
#   THEODORE_OTLP_HEADERS      e.g. `api-key=<New Relic license key>`
# The WorkOS client id and the Theodore cloud URL are inputs: each caller
# picks its environment's.

on:
  workflow_call:
    inputs:
      build-env:
        description: "THEODORE_BUILD_ENV: production | staging"
        required: true
        type: string
      version-suffix:
        description: "appended to the version files' X.Y.Z, e.g. -staging.42"
        required: false
        type: string
        default: ""
      release-tag:
        description: "the release tag latest.json's url points at (empty: v<version>)"
        required: false
        type: string
        default: ""
      workos-client-id:
        description: "the account's client id, baked in (empty: no account)"
        required: false
        type: string
        default: ""
      cloud-url:
        description: "the Theodore cloud URL, baked in (empty: no organizations; docs/cloud.md)"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "the version the build carries, suffix included"
        value: ${{ jobs.manifest.outputs.version }}
      artifact:
        description: "the workflow artifact holding the release assets"
        value: ${{ jobs.manifest.outputs.artifact }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version every platform carries, checked once.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: version (Cargo.toml == tauri.conf.json, plus the suffix)
        id: version
        env:
          SUFFIX: ${{ inputs.version-suffix }}
        run: |
          cargo_ver=$(awk '
            /^\[workspace\.package\]/ { in_block = 1; next }
            /^\[/ { in_block = 0 }
            in_block && /^version = "/ { gsub(/version = "|"/, ""); print; exit }
          ' Cargo.toml)
          tauri_ver=$(jq -r .version apps/desktop/tauri.conf.json)
          echo "cargo=$cargo_ver tauri=$tauri_ver suffix=$SUFFIX"
          if [ -z "$cargo_ver" ] || [ "$cargo_ver" != "$tauri_ver" ]; then
            echo "✗ version mismatch: Cargo.toml $cargo_ver, tauri.conf.json $tauri_ver" >&2
            echo "  run scripts/bump-version.sh <version> and commit." >&2
            exit 1
          fi
          echo "version=$cargo_ver$SUFFIX" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # macOS 26's SDK: apps linked against an older one run in compatibility
    # mode on macOS 26, with the old small window controls whatever the
    # window does (apps/desktop/src/chrome.rs).
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # `secrets` can't be read in a step `if`; expose presence as a flag.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - uses: pnpm/action-setup@v4
        if: hashFiles('ui/package.json') != ''
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: hashFiles('ui/package.json') != ''
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: build ui
        if: hashFiles('ui/package.json') != ''
        run: |
          pnpm -C ui install --frozen-lockfile
          pnpm -C ui build

      # Developer ID signing + notarization (tauri-bundler reads these env
      # vars itself — see crates/tauri-bundler/src/bundle/macos/sign.rs).
      # Loaded only when the secret exists, so an absent secret never leaks
      # an empty APPLE_CERTIFICATE into the build step below (which would
      # make tauri-bundler try, and fail, to import an empty certificate).
      - name: load Developer ID secrets
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # The Dock icon in this build's colours (staging: orange), generated
      # from apps/desktop/icons/src/icon.svg with the tauri-cli installed
      # above; production keeps the committed icons (docs/releasing.md).
      - name: app icon in this build's colours
        if: inputs.build-env != 'production'
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          icons="$PWD/target/icons/$BUILD_ENV"
          sh scripts/icon-variant.sh "$BUILD_ENV" "$icons"
          echo "ICON_DIR=$icons" >> "$GITHUB_ENV"

      # Builds + ad-hoc codesigns (tauri.conf.json's `bundle.macOS.signingIdentity:
      # "-"`, i.e. `codesign --force --deep -s -`) unless the step above loaded
      # a real Developer ID, in which case tauri-bundler signs and notarizes
      # with that instead. Also produces the updater artifacts (`.app.tar.gz`
      # + `.sig`, signed with TAURI_SIGNING_PRIVATE_KEY): the bundler makes
      # them from the `app` bundle. Not the DMG: that is the next step's.
      # `--config version` is the version the updater compares against, so a
      # staging build's `-staging.N` must be in the bundle, not only in About.
      # The bundle is `Theodore Staging.app` for staging; the assets below
      # keep their `Theodore_<version>_…` names.
      - name: build app and updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The build stamp Settings → About shows (docs/releasing.md).
          THEODORE_BUILD_ENV: ${{ inputs.build-env }}
          THEODORE_GIT_SHA: ${{ github.sha }}
          THEODORE_VERSION: ${{ needs.version.outputs.version }}
          # Compiled in as the lowest-priority client id (docs/releasing.md).
          THEODORE_WORKOS_CLIENT_ID: ${{ inputs.workos-client-id }}
          # The Theodore cloud for this channel, the lowest-priority source
          # (docs/cloud.md "App side"). Optional: not a release key.
          THEODORE_CLOUD_URL: ${{ inputs.cloud-url }}
          # "Sign in with GitHub" (device flow): the GitHub OAuth App's
          # client id, public, the same for every build.
          THEODORE_GITHUB_CLIENT_ID: ${{ vars.THEODORE_GITHUB_CLIENT_ID }}
          # Remote telemetry sinks, compiled in as the lowest-priority source
          # (docs/telemetry.md); unset: the build has none. Nothing is sent
          # until the user chooses during onboarding or in Settings.
          THEODORE_OTLP_ENDPOINT: ${{ vars.THEODORE_OTLP_ENDPOINT }}
          THEODORE_OTLP_HEADERS: ${{ secrets.THEODORE_OTLP_HEADERS }}
          THEODORE_POSTHOG_HOST: ${{ vars.THEODORE_POSTHOG_HOST }}
          THEODORE_POSTHOG_KEY: ${{ vars.THEODORE_POSTHOG_KEY }}
        # One --config: the version, and for any build but production its
        # own names (productName, identifier, URL scheme) from
        # tauri.<env>.conf.json, so it installs beside production without
        # sharing its data (docs/releasing.md "One identity per build").
        run: |
          case "$THEODORE_BUILD_ENV" in
            production) names='{}' ;;
            *) names=$(cat "apps/desktop/tauri.$THEODORE_BUILD_ENV.conf.json") ;;
          esac
          # Its names, then its version and (outside production) its icon.
          config=$(jq -nc --argjson names "$names" --arg version "$VERSION" \
            --arg icons "${ICON_DIR:-}" '
            $names * { version: $version }
            * if $icons == "" then {} else
                { bundle: { icon: [ "32x32.png", "128x128.png", "icon.icns" ]
                                  | map("\($icons)/\(.)") } }
              end')
          echo "config: $config"
          cargo tauri build --target aarch64-apple-darwin --bundles app \
            --config "$config"

      # dmgbuild needs python >= 3.10; pin one rather than trust the image.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The DMG from the app above, laid out as a drag-to-install window
      # (docs/releasing.md "DMG window"). tauri-bundler's own DMG can't be
      # used: under CI=true it skips its Finder layout, and on macOS 26 that
      # layout loses the background anyway. Volume name = product name, as
      # the bundler had it. With a Developer ID the DMG is signed with it,
      # as the bundler did (never notarized: the app inside is); ad-hoc
      # builds leave it unsigned, as the bundler did.
      - name: build dmg
        run: |
          bundle="target/aarch64-apple-darwin/release/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n1)
          test -d "$app"
          dmg="$bundle/dmg/Theodore_${VERSION}_aarch64.dmg"
          sh scripts/build-dmg.sh "$app" "$dmg" "$(basename "$app" .app)"
          if [ "$HAS_APPLE_CERT" = true ]; then
            # The bundler's keychain is gone with its process: import again.
            keychain="$RUNNER_TEMP/dmg-signing.keychain-db"
            pass=$(uuidgen)
            security create-keychain -p "$pass" "$keychain"
            security set-keychain-settings -lut 900 "$keychain"
            security unlock-keychain -p "$pass" "$keychain"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
            codesign --force --timestamp --keychain "$keychain" \
              --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            codesign --verify --verbose "$dmg"
            security delete-keychain "$keychain"
          fi

      # Versioned names, so a rolling release (channel-staging) never serves
      # a new tarball under an old latest.json's signature mid-upload.
      - name: collect release assets
        run: |
          bundle="target/aarch64-apple-darwin/release/bundle"
          dmg=$(find "$bundle/dmg" -name '*.dmg' | head -n1)
          tarball=$(find "$bundle/macos" -name '*.app.tar.gz' | head -n1)
          test -f "$dmg" && test -f "$tarball" && test -f "$tarball.sig"
          mkdir -p dist
          cp "$dmg" "dist/Theodore_${VERSION}_aarch64.dmg"
          cp "$tarball" "dist/Theodore_${VERSION}_aarch64.app.tar.gz"
          cp "$tarball.sig" "dist/Theodore_${VERSION}_aarch64.app.tar.gz.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: theodore-${{ inputs.build-env }}-macos-aarch64
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The AppImage and the .deb, each signed for the updater. Built on the
  # oldest Ubuntu the release supports: the binaries need its glibc (2.35)
  # or newer. Native runners, no cross-compiling.
  linux:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            deb-arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            deb-arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # ci.yml's ui-e2e list minus its WebDriver and xvfb, plus libdbus
      # for the Secret Service keychain, and jq: the arm64 image is slimmer.
      - name: apt packages (webkit2gtk, tauri build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            file \
            jq

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - uses: pnpm/action-setup@v4
        if: hashFiles('ui/package.json') != ''
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: hashFiles('ui/package.json') != ''
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: build ui
        if: hashFiles('ui/package.json') != ''
        run: |
          pnpm -C ui install --frozen-lockfile
          pnpm -C ui build

      - name: app icon in this build's colours
        if: inputs.build-env != 'production'
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          icons="$PWD/target/icons/$BUILD_ENV"
          sh scripts/icon-variant.sh "$BUILD_ENV" "$icons"
          echo "ICON_DIR=$icons" >> "$GITHUB_ENV"

      # Same env as the macOS build above: keep the two in step. The
      # bundler signs the .AppImage and the .deb themselves (`.sig` next to
      # each); the updater installs either directly, no tarball.
      - name: build AppImage, deb and updater signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          THEODORE_BUILD_ENV: ${{ inputs.build-env }}
          THEODORE_GIT_SHA: ${{ github.sha }}
          THEODORE_VERSION: ${{ needs.version.outputs.version }}
          THEODORE_WORKOS_CLIENT_ID: ${{ inputs.workos-client-id }}
          THEODORE_CLOUD_URL: ${{ inputs.cloud-url }}
          THEODORE_GITHUB_CLIENT_ID: ${{ vars.THEODORE_GITHUB_CLIENT_ID }}
          THEODORE_OTLP_ENDPOINT: ${{ vars.THEODORE_OTLP_ENDPOINT }}
          THEODORE_OTLP_HEADERS: ${{ secrets.THEODORE_OTLP_HEADERS }}
          THEODORE_POSTHOG_HOST: ${{ vars.THEODORE_POSTHOG_HOST }}
          THEODORE_POSTHOG_KEY: ${{ vars.THEODORE_POSTHOG_KEY }}
        # As on macOS, plus outside production its own binary name: a .deb
        # installs /usr/bin/<binary> and icons named after it, so staging
        # needs its own to install beside production.
        run: |
          case "$THEODORE_BUILD_ENV" in
            production) names='{}' ;;
            *) names=$(jq -c --arg bin "theodore-app-$THEODORE_BUILD_ENV" \
                 '. + { mainBinaryName: $bin }' \
                 "apps/desktop/tauri.$THEODORE_BUILD_ENV.conf.json") ;;
          esac
          config=$(jq -nc --argjson names "$names" --arg version "$VERSION" \
            --arg icons "${ICON_DIR:-}" '
            $names * { version: $version }
            * if $icons == "" then {} else
                { bundle: { icon: [ "32x32.png", "128x128.png", "128x128@2x.png" ]
                                  | map("\($icons)/\(.)") } }
              end')
          echo "config: $config"
          cargo tauri build --target "$TARGET" --bundles appimage,deb \
            --config "$config"

      # Versioned names like the DMG's; arch as each format spells it.
      - name: collect release assets
        env:
          ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb-arch }}
        run: |
          bundle="target/$TARGET/release/bundle"
          appimage=$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' | head -n1)
          deb=$(find "$bundle/deb" -maxdepth 1 -name '*.deb' | head -n1)
          test -f "$appimage" && test -f "$appimage.sig"
          test -f "$deb" && test -f "$deb.sig"
          mkdir -p dist
          cp "$appimage" "dist/Theodore_${VERSION}_${ARCH}.AppImage"
          cp "$appimage.sig" "dist/Theodore_${VERSION}_${ARCH}.AppImage.sig"
          cp "$deb" "dist/Theodore_${VERSION}_${DEB_ARCH}.deb"
          cp "$deb.sig" "dist/Theodore_${VERSION}_${DEB_ARCH}.deb.sig"
          dpkg-deb --info "dist/Theodore_${VERSION}_${DEB_ARCH}.deb"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: theodore-${{ inputs.build-env }}-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Every platform's assets in one artifact, and the latest.json the app
  # polls, pointing at them (scripts/updater-manifest.sh).
  manifest:
    needs: [version, build, linux]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
      artifact: theodore-${{ inputs.build-env }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: theodore-${{ inputs.build-env }}-*
          merge-multiple: true
          path: dist

      - name: build latest.json
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag="${RELEASE_TAG:-v$VERSION}"
          base="https://github.com/${{ github.repository }}/releases/download/$tag"
          sh scripts/updater-manifest.sh dist "$VERSION" "$base" > dist/latest.json
          cat dist/latest.json
          # Every platform built above must be in it.
          for key in darwin-aarch64 \
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb \
            linux-aarch64 linux-aarch64-appimage linux-aarch64-deb; do
            jq -e --arg k "$key" '.platforms[$k].url' dist/latest.json >/dev/null || {
              echo "✗ latest.json has no $key" >&2
              exit 1
            }
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: theodore-${{ inputs.build-env }}
          path: dist/
          if-no-files-found: error
