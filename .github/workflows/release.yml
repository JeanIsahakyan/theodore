name: Release

# Plan §11.1. The production build, on every push to main (a merge from
# staging). build.yml builds it; the publish job below releases it only
# when the version files carry a version with no `v<version>` tag yet:
#
#   main @ 0.3.0, no v0.3.0  ──▶ build ──▶ tag v0.3.0 + GitHub release
#   main @ 0.3.0, v0.3.0 set ──▶ build ──▶ workflow artifact only
#
# The release carries every asset build.yml made: the macOS DMG and
# updater tarball, the Linux AppImages and .debs (x86_64, aarch64), each
# updater asset's .sig, and latest.json.
#
# Cutting a release is bumping the version and merging it to main; a merge
# that doesn't bump still proves main builds. Tags are made here, never
# pushed by hand (docs/releasing.md "Cutting a production release").
#
# A release also ships the iOS app: the ios job builds it on EAS with the
# production profile and uploads it to App Store Connect (TestFlight).
# Sending that build to App Review stays a manual step in App Store Connect.
#
#   v0.3.0 released ──▶ eas build (EAS cloud) ──▶ eas submit ──▶ TestFlight
#
# Variables: THEODORE_WORKOS_CLIENT_ID, the production account's client id,
# baked into the build (unset: no account), and THEODORE_CLOUD_URL, the
# production cloud (optional; unset: no organizations). Secrets and the telemetry
# variables: build.yml. The ios job writes THEODORE_POSTHOG_KEY / _HOST into
# the EAS production profile's env (EXPO_PUBLIC_THEODORE_POSTHOG_*), so the
# store build has the same usage sink as the desktop (docs/telemetry.md
# "Mobile"); unset: none. The commit goes along as EXPO_PUBLIC_THEODORE_GIT_SHA.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time and never cancelled: a second merge waits, then sees the
# tag the first one made and builds only.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      build-env: production
      workos-client-id: ${{ vars.THEODORE_WORKOS_CLIENT_ID }}
      cloud-url: ${{ vars.THEODORE_CLOUD_URL }}
    secrets: inherit

  publish:
    needs: build
    # A dispatch from another branch builds, never releases.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    outputs:
      released: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: is v${{ needs.build.outputs.version }} already tagged?
        id: tag
        run: |
          # --exit-code: 0 found, 2 not found, anything else is an error.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || rc=$?
          case "$rc" in
            0) echo "v$VERSION is already released: built only, nothing published."
               echo "release=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "v$VERSION is new: releasing."
               echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "✗ git ls-remote failed ($rc)" >&2; exit 1 ;;
          esac

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.release == 'true'
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      # Creates the tag at this commit. A tag made with GITHUB_TOKEN starts
      # no other workflow.
      - name: publish GitHub release
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --generate-notes \
            dist/*

  # The iOS build of this release (docs/mobile.md "Store builds"). EAS
  # builds it in its cloud with the distribution certificate and App Store
  # profile from the secrets below (credentialsSource local, made here, so
  # nothing depends on credentials stored on EAS), then submits it with the
  # App Store Connect API key build.yml notarizes with. The build number is
  # EAS's own, remote and auto-incremented; the version is app.json's, which
  # scripts/bump-version.sh keeps equal to the desktop one.
  #
  # Secrets: EXPO_TOKEN; IOS_DIST_P12 (base64), IOS_DIST_P12_PASSWORD,
  # IOS_APPSTORE_PROFILE (base64 .mobileprovision); APPLE_API_KEY,
  # APPLE_API_ISSUER, APPLE_API_KEY_P8.
  ios:
    needs: publish
    if: needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: install
        run: |
          pnpm -C mobile install --frozen-lockfile
          npm install -g eas-cli@27

      # Files live outside the repo; credentials.json is gitignored, so
      # the archive EAS uploads never carries them.
      - name: signing credentials
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          THEODORE_POSTHOG_KEY: ${{ vars.THEODORE_POSTHOG_KEY }}
          THEODORE_POSTHOG_HOST: ${{ vars.THEODORE_POSTHOG_HOST }}
        run: |
          creds="$RUNNER_TEMP/ios"
          mkdir -p "$creds"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$creds/dist.p12"
          printf '%s' "$IOS_APPSTORE_PROFILE" | base64 --decode > "$creds/appstore.mobileprovision"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$creds/AuthKey.p8"
          jq -n --arg dir "$creds" --arg pass "$IOS_DIST_P12_PASSWORD" '{ios: {
            provisioningProfilePath: "\($dir)/appstore.mobileprovision",
            distributionCertificate: {path: "\($dir)/dist.p12", password: $pass}}}' \
            > mobile/credentials.json
          # eas submit takes a local API key only from the submit profile
          # (in --non-interactive mode, env vars are not enough).
          # Telemetry: the build-time env EAS bakes in (eas.json can't read
          # secrets or variables itself); an unset variable adds nothing.
          jq --arg key "$creds/AuthKey.p8" --arg id "$APPLE_API_KEY" --arg iss "$APPLE_API_ISSUER" \
             --arg ph_key "$THEODORE_POSTHOG_KEY" --arg ph_host "$THEODORE_POSTHOG_HOST" \
             --arg sha "$GITHUB_SHA" '
            .build.production.credentialsSource = "local"
            | .submit.production.ios += {ascApiKeyPath: $key, ascApiKeyId: $id, ascApiKeyIssuerId: $iss}
            | .build.production.env += ({EXPO_PUBLIC_THEODORE_BUILD_ENV: "production", EXPO_PUBLIC_THEODORE_GIT_SHA: $sha}
                + (if $ph_key == "" then {} else {EXPO_PUBLIC_THEODORE_POSTHOG_KEY: $ph_key} end)
                + (if $ph_host == "" then {} else {EXPO_PUBLIC_THEODORE_POSTHOG_HOST: $ph_host} end))' \
            mobile/eas.json > "$creds/eas.json"
          mv "$creds/eas.json" mobile/eas.json

      - name: build on EAS
        working-directory: mobile
        run: |
          eas build -p ios --profile production --non-interactive --json > "$RUNNER_TEMP/build.json"
          id=$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")
          test -n "$id" && test "$id" != null
          echo "BUILD_ID=$id" >> "$GITHUB_ENV"

      - name: submit to App Store Connect
        working-directory: mobile
        run: eas submit -p ios --profile production --id "$BUILD_ID" --non-interactive --wait
