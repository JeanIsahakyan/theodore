name: Mobile web

# Deploys the web build of the Expo app in mobile/ (docs/mobile.md "Build and
# release") as a static-assets Worker (mobile/wrangler.toml), one per
# channel, alongside the branch flow (docs/releasing.md):
#
#   push staging, mobile/** changed ──▶ checks ──▶ theodore-web-staging
#   push main,    mobile/** changed ──▶ checks ──▶ theodore-web
#
# A push that touches nothing under mobile/ deploys nothing. The web app is
# not part of the desktop build: no version bump, no tag, no release. The
# iOS build ships with a desktop release (release.yml `ios`); Android is
# an EAS build the owner starts by hand (docs/mobile.md).
#
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, the same as
# cloud.yml (Workers Scripts: Edit; and, for the custom domains in
# mobile/wrangler.toml, Zone: Read, DNS: Edit and Workers Routes: Edit on
# theodore.cloud). Variables, baked into the bundle at build time
# (EXPO_PUBLIC_*): the per-environment ones staging.yml and release.yml
# already use, THEODORE_WORKOS_CLIENT_ID[_STAGING] and
# THEODORE_CLOUD_URL[_STAGING]. An unset cloud URL is the channel's
# api[-staging].theodore.cloud (docs/cloud.md "Environments"). Staging
# falls back to the app's own staging client id when that is unset;
# production refuses to build without its client id. Manual run: pick the
# environment; production deploys only from main.
# Telemetry (docs/telemetry.md "Mobile"): THEODORE_POSTHOG_KEY / _HOST, the
# same repository variables build.yml compiles into the desktop, become
# EXPO_PUBLIC_THEODORE_POSTHOG_KEY / _HOST; unset: the web build has no
# usage sink (error reports still go through the cloud). Nothing is sent
# before the user chooses.

on:
  push:
    branches: [main, staging]
    paths: ['mobile/**', '.github/workflows/mobile-web.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Which web Worker to deploy
        type: choice
        options: [staging, production]
        default: staging

# One deploy per environment at a time, never cancelled mid-deploy: a push
# that lands during one waits, then deploys the newest.
concurrency:
  group: mobile-web-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - name: production deploys only from main
        if: env.TARGET == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::production deploys only from main (this run is on ${GITHUB_REF_NAME})"
          exit 1

      - name: resolve the build variables
        # The web app calls the cloud of its own channel: the variable when
        # set, else the channel's host on theodore.cloud.
        env:
          PROD_CLIENT_ID: ${{ vars.THEODORE_WORKOS_CLIENT_ID }}
          PROD_CLOUD_URL: ${{ vars.THEODORE_CLOUD_URL || 'https://api.theodore.cloud' }}
          STAGING_CLIENT_ID: ${{ vars.THEODORE_WORKOS_CLIENT_ID_STAGING }}
          STAGING_CLOUD_URL: ${{ vars.THEODORE_CLOUD_URL_STAGING || 'https://api-staging.theodore.cloud' }}
          POSTHOG_KEY: ${{ vars.THEODORE_POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.THEODORE_POSTHOG_HOST }}
        run: |
          {
            echo "POSTHOG_KEY=$POSTHOG_KEY"
            echo "POSTHOG_HOST=$POSTHOG_HOST"
            echo "BUILD_ENV=$TARGET"
          } >> "$GITHUB_ENV"
          if [ "$TARGET" = production ]; then
            if [ -z "$PROD_CLIENT_ID" ]; then
              echo "::error::set the THEODORE_WORKOS_CLIENT_ID repo variable: a production web build must not fall back to the staging client id"
              exit 1
            fi
            {
              echo "WORKOS_CLIENT_ID=$PROD_CLIENT_ID"
              echo "CLOUD_URL=$PROD_CLOUD_URL"
            } >> "$GITHUB_ENV"
          else
            {
              echo "WORKOS_CLIENT_ID=$STAGING_CLIENT_ID"
              echo "CLOUD_URL=$STAGING_CLOUD_URL"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: install
        run: pnpm -C mobile install --frozen-lockfile

      # The same checks as ci.yml's mobile job: a deploy never ships what
      # CI would have refused.
      - name: typecheck
        run: pnpm -C mobile typecheck

      - name: lint
        run: pnpm -C mobile lint

      - name: format
        run: pnpm -C mobile format:check

      - name: test
        run: pnpm -C mobile test

      - name: build the web bundle
        # An unset variable is left out, not exported empty: the app's
        # defaults use `??`, which an empty string would defeat.
        run: |
          if [ -n "$WORKOS_CLIENT_ID" ]; then export EXPO_PUBLIC_WORKOS_CLIENT_ID="$WORKOS_CLIENT_ID"; fi
          if [ -n "$CLOUD_URL" ]; then export EXPO_PUBLIC_CLOUD_URL="$CLOUD_URL"; fi
          if [ -n "$POSTHOG_KEY" ]; then export EXPO_PUBLIC_THEODORE_POSTHOG_KEY="$POSTHOG_KEY"; fi
          if [ -n "$POSTHOG_HOST" ]; then export EXPO_PUBLIC_THEODORE_POSTHOG_HOST="$POSTHOG_HOST"; fi
          export EXPO_PUBLIC_THEODORE_BUILD_ENV="$BUILD_ENV"
          export EXPO_PUBLIC_THEODORE_GIT_SHA="$GITHUB_SHA"
          pnpm -C mobile build:web

      # `/callback` and deep routes serve index.html through the Worker's
      # `not_found_handling = "single-page-application"` (mobile/wrangler.toml).
      # The deploy also creates the environment's custom domain
      # (app[-staging].theodore.cloud): DNS record and certificate.
      - name: deploy ${{ env.TARGET }}
        working-directory: mobile
        run: pnpm dlx wrangler@4 deploy --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
