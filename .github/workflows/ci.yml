name: CI

# Both long-lived branches (docs/releasing.md "Branch flow"): pushes to
# them, and every PR, whichever branch it targets — into staging, into
# main, or stacked on another PR.
on:
  push:
    branches: [main, staging]
  pull_request:

# Rust caches are saved from staging only and every PR reads them: a ~1 GB
# cache per PR pushed staging's out of the repo's 10 GB, so clippy rebuilt
# the dependencies on most runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # fmt and clippy on the macOS release runner (build.yml), so CI
    # compiles against the same SDK; rust-test-linux covers Linux.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' }}

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Tests next to clippy, not after it: the two compile separately anyway
  # (clippy only checks), so the PR waits for the slower one, not both.
  rust-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' }}

      - name: test
        run: cargo test --workspace

      - name: contract + bindings TS up to date
        run: |
          cargo run -p theodore-contract --bin export-ts
          cargo run -p theodore-desktop -- --export-bindings
          git diff --exit-code -- ui/src/gen

  # The workspace's tests on Linux, which ships too (build.yml): catches
  # code that only compiles or passes on macOS. The release builds'
  # Ubuntu, and their apt packages.
  rust-test-linux:
    runs-on: ubuntu-22.04
    # Fails with its logs instead of losing the runner: three times it ran
    # ~50 min and died with no log, even `if: always()` steps skipped (the
    # runner out of memory linking many test binaries at once).
    timeout-minutes: 75
    # Two jobs at a time, no incremental state and no debug info keep
    # rustc and the linker inside the hosted runner's memory and disk.
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        # The hosted image ships ~30 GB of SDKs this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: apt packages (webkit2gtk, tauri build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' }}

      - name: build the tests
        # The desktop crate (WebKitGTK) is built on Linux by `ui-e2e`.
        run: cargo test --workspace --exclude theodore-desktop --no-run

      # One step per crate: a step's log is kept as soon as it ends, so if a
      # test takes the runner down (it did, with no log, four times) the
      # last step shown names the crate.
      - name: test secrets
        run: timeout 20m cargo test -p theodore-secrets --no-fail-fast

      - name: test agents
        run: timeout 20m cargo test -p theodore-agents --no-fail-fast

      - name: test code-intel-toolchain
        run: timeout 20m cargo test -p theodore-code-intel-toolchain --no-fail-fast

      - name: test git
        run: timeout 20m cargo test -p theodore-git --no-fail-fast

      - name: test store
        run: timeout 20m cargo test -p theodore-store --no-fail-fast

      - name: test ports
        run: timeout 20m cargo test -p theodore-ports --no-fail-fast

      - name: test domain
        run: timeout 20m cargo test -p theodore-domain --no-fail-fast

      - name: test contract
        run: timeout 20m cargo test -p theodore-contract --no-fail-fast

      - name: test fleet-protocol
        run: timeout 20m cargo test -p theodore-fleet-protocol --no-fail-fast

      - name: test fleet
        run: timeout 20m cargo test -p theodore-fleet --no-fail-fast

      - name: test telemetry
        run: timeout 20m cargo test -p theodore-telemetry --no-fail-fast

      - name: test account-workos
        run: timeout 20m cargo test -p theodore-account-workos --no-fail-fast

      - name: test code-intel
        run: timeout 20m cargo test -p theodore-code-intel --no-fail-fast

      - name: test code-intel-lsp
        run: timeout 20m cargo test -p theodore-code-intel-lsp --no-fail-fast

      - name: test code-intel-syntax
        run: timeout 20m cargo test -p theodore-code-intel-syntax --no-fail-fast

      - name: test grouping
        run: timeout 20m cargo test -p theodore-grouping --no-fail-fast

      - name: test host-bitbucket
        run: timeout 20m cargo test -p theodore-host-bitbucket --no-fail-fast

      - name: test host-github
        run: timeout 20m cargo test -p theodore-host-github --no-fail-fast

      - name: test host-gitlab
        run: timeout 20m cargo test -p theodore-host-gitlab --no-fail-fast

      - name: test host-http
        run: timeout 20m cargo test -p theodore-host-http --no-fail-fast

      - name: test linear
        run: timeout 20m cargo test -p theodore-linear --no-fail-fast

      - name: test mcp
        run: timeout 20m cargo test -p theodore-mcp --no-fail-fast

      - name: test sandbox
        run: timeout 20m cargo test -p theodore-sandbox --no-fail-fast

      - name: test fixtures
        run: timeout 20m cargo test -p theodore-fixtures --no-fail-fast

      - name: test runtime
        run: timeout 20m cargo test -p theodore-runtime --no-fail-fast

      - name: test cli
        run: timeout 20m cargo test -p theodore-cli --no-fail-fast

      - name: test app
        run: timeout 20m cargo test -p theodore-app --no-fail-fast

      - name: disk left
        if: always()
        run: df -h /

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ui
        name: check for ui/ package
        run: |
          if [ -f ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.ui.outputs.present == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: install
        if: steps.ui.outputs.present == 'true'
        run: pnpm -C ui install --frozen-lockfile

      - name: typecheck
        if: steps.ui.outputs.present == 'true'
        run: pnpm -C ui typecheck

      - name: lint
        if: steps.ui.outputs.present == 'true'
        run: pnpm -C ui lint

      - name: test
        if: steps.ui.outputs.present == 'true'
        run: pnpm -C ui test

      - name: build
        if: steps.ui.outputs.present == 'true'
        run: pnpm -C ui build

      - name: skipped (no ui/package.json yet)
        if: steps.ui.outputs.present != 'true'
        run: echo "ui/ not scaffolded yet, skipping"

  cloud:
    # The Worker in cloud/ (docs/cloud.md). Own lockfile, so its own install;
    # tests run against a fake WorkOS, no network and no secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml

      - name: install
        run: pnpm -C cloud install --frozen-lockfile

      - name: typecheck
        run: pnpm -C cloud typecheck

      - name: lint
        run: pnpm -C cloud lint

      - name: format
        run: pnpm -C cloud format:check

      - name: test
        run: pnpm -C cloud test

  mobile:
    # The Expo app in mobile/ (docs/mobile.md). Own lockfile, so its own
    # install. The web export proves the bundle builds; the iOS/Android
    # builds are EAS, started by hand, not CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: install
        run: pnpm -C mobile install --frozen-lockfile

      - name: typecheck
        run: pnpm -C mobile typecheck

      - name: lint
        run: pnpm -C mobile lint

      - name: format
        run: pnpm -C mobile format:check

      - name: test
        run: pnpm -C mobile test

      - name: web bundle builds
        run: pnpm -C mobile build:web

  ui-e2e:
    # `tauri-driver` only speaks WebDriver to WebKitWebDriver (Linux) or
    # Edge WebDriver (Windows) — there is no WKWebView (macOS) backend, so
    # this is the one job that builds and drives the Tauri app on Linux
    # (plan §12, §12.1). See `e2e/README.md` for the equivalent local steps.
    # Pinned: package names (webkit2gtk-driver) differ between Ubuntu releases.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: apt packages (webkit2gtk + its WebDriver, xvfb, tauri build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb \
            patchelf

      - name: install tauri-driver
        run: cargo install tauri-driver --locked

      - name: build the ui bundle
        run: |
          pnpm -C ui install --frozen-lockfile
          pnpm -C ui build

      - name: build the debug app
        # Picks up `ui/dist` (just built above) via `tauri.conf.json`'s
        # `frontendDist` — no `cargo tauri` CLI needed for a plain binary.
        # `custom-protocol` makes a debug binary serve that bundle; without
        # it, it loads `devUrl` (the Vite dev server) and the window is blank.
        run: cargo build -p theodore-desktop --features tauri/custom-protocol

      - name: e2e dependencies
        run: pnpm -C e2e install --frozen-lockfile

      - name: e2e typecheck
        run: pnpm -C e2e typecheck

      - name: run the specs
        # A screen bigger than the 1400×900 window (`tauri.conf.json`), so
        # it opens at full size and the review lays out the same each run.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm -C e2e test
        env:
          TAURI_APP_BINARY: ${{ github.workspace }}/target/debug/theodore-app
          THEODORE_FIXTURES: ${{ github.workspace }}/crates/fixtures/data/demo
