name: Website

# Deploys the website in site/ (docs/website.md) to the Cloudflare Pages
# project `theodore-site`, which serves theodore.cloud:
#
#   push main, site/** changed ──▶ checks ──▶ build ──▶ pages deploy --branch main (production)
#   Release workflow finished      ──▶ rebuild ──▶ pages deploy --branch main (new version baked in)
#   pull request touching site/ ──▶ checks ──▶ build ──▶ pages deploy --branch <pr branch> (preview)
#                                                        ──▶ a comment on the PR with the preview URL
#
# A push that touches nothing under site/ deploys nothing. The site is not
# part of the app build: no version bump, no tag, no release.
#
# Secrets: CLOUDFLARE_API_TOKEN (with "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID, the same as cloud.yml and mobile-web.yml.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # A new release: rebuild so the pages carry its version and links
  # (scripts/prerender.mjs bakes the latest release in).
  workflow_run:
    workflows: [Release]
    types: [completed]

# One production deploy at a time, never cancelled mid-deploy; one preview
# per PR, the newest push wins.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # After a release only when it succeeded (it runs on main's code then).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # A PR from a fork has no secrets: build only.
    env:
      CAN_DEPLOY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: install
        run: pnpm -C site install --frozen-lockfile

      - name: typecheck
        run: pnpm -C site typecheck

      - name: lint
        run: pnpm -C site lint

      - name: format
        run: pnpm -C site format:check

      # The build fetches the latest release from GitHub's API to bake the
      # version and download links into /download; a token lifts the
      # anonymous rate limit. Without it the page falls back to the release
      # page and the browser asks again.
      - name: build
        run: pnpm -C site build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: deploy production
        if: env.CAN_DEPLOY == 'true' && github.event_name != 'pull_request'
        run: pnpm -C site dlx wrangler@4 pages deploy site/dist --project-name theodore-site --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: deploy preview
        if: env.CAN_DEPLOY == 'true' && github.event_name == 'pull_request'
        id: preview
        run: |
          out=$(pnpm -C site dlx wrangler@4 pages deploy site/dist --project-name theodore-site --branch "${{ github.head_ref }}" --commit-dirty=true)
          echo "$out"
          url=$(echo "$out" | grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: comment the preview URL
        if: env.CAN_DEPLOY == 'true' && github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          body="Website preview: $URL (commit ${{ github.event.pull_request.head.sha }})"
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" --jq '.[] | select(.body | startswith("Website preview:")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "${{ github.event.number }}" --body "$body"
          fi
