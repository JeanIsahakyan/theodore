- id: py-trace-httpx-get
  repo: https://github.com/encode/httpx
  rev: 26d48e0634e6ee9cdc0533996db289ce4b430177
  kind: answer
  prompt: |
    When I call `httpx.get(url)` without a custom transport, what is the call path from
    that function down to the method that hands the request to httpcore? List each hop
    as function and file.
  check:
    type: regex
    value: '(?is)_send_single_request.*(\bHTTPTransport\b.*handle_request|handle_request.*\bHTTPTransport\b)'
  timeout_s: 600

