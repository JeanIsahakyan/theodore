- id: ts-default-router
  repo: https://github.com/honojs/hono
  rev: 734755ace341607628219ea1dd8ca17f01bf1a5c
  kind: answer
  prompt: |
    If I create an app with `new Hono()` from 'hono' and pass no router, which router
    does the route matching?
  check:
    type: regex
    value: '(?is)SmartRouter.*(RegExpRouter.*TrieRouter|TrieRouter.*RegExpRouter)'
  timeout_s: 600

