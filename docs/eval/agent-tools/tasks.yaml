- id: rust-reexport-sandbox-data-dir
  repo: '.'
  rev: 2a142d87e162ed38212e55a91704a9a90a5ab506
  kind: answer
  prompt: |
    `theodore sandbox` without `--data-dir` falls back to
    `theodore_runtime::sandbox_data_dir`. Which function is that really, in which file,
    and what directory does it return?
  check:
    type: regex
    value: '(?is)(runtime/src/sandbox\.rs.*\.theodore-sandbox|\.theodore-sandbox.*runtime/src/sandbox\.rs)'
  timeout_s: 600

