- id: rust-host-github-parse-millis-fallback
  repo: '.'
  rev: 2a142d87e162ed38212e55a91704a9a90a5ab506
  kind: edit
  prompt: |
    In crates/host-github, `time::parse_millis` silently returns 0 for a timestamp it
    can't parse. Change it to `parse_millis(s: &str, fallback: i64) -> i64`, returning
    `fallback` in that case, and update every caller in host-github to pass `0` so
    behaviour stays the same. The GitLab and Bitbucket crates have their own copies;
    leave those alone.
  check:
    type: command
    run: 'bash docs/eval/agent-tools/checks/rust-host-github-parse-millis-fallback.sh'
  timeout_s: 900

- id: ts-impl-router
  repo: https://github.com/honojs/hono
  rev: 734755ace341607628219ea1dd8ca17f01bf1a5c
  kind: answer
  prompt: |
    Which classes declare that they implement the `Router` interface from src/router.ts?
    Finish your answer with one line `IMPLEMENTORS: <class names, comma-separated,
    sorted alphabetically>`.
  check:
    type: regex
    value: '(?im)^[\s>*_#-]*IMPLEMENTORS[*_`]*:[*_`]*[ \t]*[`*_]*LinearRouter(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*PatternRouter(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*PreparedRegExpRouter(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*RegExpRouter(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*SmartRouter(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*TrieRouter(?:\(\))?[`*_]*[\s.*_`]*$'
  timeout_s: 600

- id: ts-trace-jsx-runtime
  repo: https://github.com/honojs/hono
  rev: 734755ace341607628219ea1dd8ca17f01bf1a5c
  kind: answer
  prompt: |
    With `jsxImportSource: "hono/jsx"`, TypeScript compiles `<div />` to a call of `jsx`
    imported from `hono/jsx/jsx-runtime`. Which function actually runs for that call,
    and which function does it hand off to to build the node? Give the files.
  check:
    type: regex
    value: '(?is)((src/|hono/|[\s`''"(\[*])jsx/jsx-dev-runtime\.ts.*\bjsxFn\b|\bjsxFn\b.*(src/|hono/|[\s`''"(\[*])jsx/jsx-dev-runtime\.ts)'
  timeout_s: 600

