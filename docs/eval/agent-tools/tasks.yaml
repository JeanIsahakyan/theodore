# Task suite: an agent with and without the code-intelligence tools.
# Ground truth, derivations and the check results: TASKS.md next to this file.
# check.run paths are relative to the Theodore repo root; cwd = the agent's worktree.

- id: smoke-domain-crate-name
  repo: '.'
  rev: 2a142d87e162ed38212e55a91704a9a90a5ab506
  kind: answer
  prompt: |
    What is the package name in crates/domain/Cargo.toml? Reply with just the name.
  check:
    type: contains
    value: 'theodore-domain'
  timeout_s: 120

- id: rust-trace-language-remove
  repo: '.'
  rev: 2a142d87e162ed38212e55a91704a9a90a5ab506
  kind: answer
  prompt: |
    Project settings → Languages → Remove ends up in the `code_intel_remove` Tauri
    command. Trace the Rust call path from that command down to the code that deletes
    the downloaded language server from disk. List each hop as function and file.
  check:
    type: regex
    value: '(?is)remove_language.*remove_server'
  timeout_s: 600

- id: rust-impl-telemetry-sink
  repo: '.'
  rev: 2a142d87e162ed38212e55a91704a9a90a5ab506
  kind: answer
  prompt: |
    Which types implement the `Sink` trait of the telemetry crate? Finish your answer
    with one line `IMPLEMENTORS: <type names, comma-separated, sorted alphabetically>`.
  check:
    type: regex
    value: '(?im)^[\s>*_#-]*IMPLEMENTORS[*_`]*:[*_`]*[ \t]*[`*_]*(?:(?:[\w:]+::))?Capture(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*(?:(?:[\w:]+::))?FileSink(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*(?:(?:[\w:]+::))?OtlpSink(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*(?:(?:[\w:]+::))?PosthogSink(?:\(\))?[`*_]*[ \t]*,[ \t]*[`*_]*(?:(?:[\w:]+::))?StderrSink(?:\(\))?[`*_]*[\s.*_`]*$'
  timeout_s: 600

