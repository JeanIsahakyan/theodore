# Theodore config for JeanIsahakyan/theodore (docs/config.md).
# Layers, later wins key by key (lists replace):
#   ~/.theodore/config.yaml               global: your defaults
#   <repo>/.theodore/config.yaml          repo: shared with the team
#   <repo>/.theodore/config.local.yaml    local: yours, gitignored
# Commands set here or in config.local.yaml run without asking; commands
# from a repo's file run only after you allow them.

review:
  agents:
    chat: claude
    fix: claude
    grouping: claude
    skills:
    - claude
  # instructions: Prefer small functions. Flag any new dependency.
  # context: [docs/architecture.md, "docs/adr/*.md"]  # read first
